# Optional standalone Nginx entry point for Laragon validation.
# Use laragon-nexa-inv.conf as a site include when Laragon manages nginx.conf.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include C:/laragon/bin/nginx/nginx-1.22.0/conf/mime.types;
    default_type application/octet-stream;
    sendfile on;

    include C:/Users/Suswati/Documents/Nexa-inv/nginx/laragon-nexa-inv.conf;
}
