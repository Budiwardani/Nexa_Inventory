# Nexa-Inv for Laragon on Windows
# Place this file in Laragon's Nginx site directory, or include it from nginx.conf.
# Expected project path: C:/laragon/www/Nexa-inv

server {
    listen 80;
    server_name nexa-inv.test localhost;

    client_max_body_size 25m;
    root C:/laragon/www/Nexa-inv/frontend/dist;
    index index.html;

    # Laravel API: PHP-FPM used by Laragon, no separate artisan server required.
    location ^~ /api/ {
        include C:/laragon/bin/nginx/nginx-1.22.0/conf/fastcgi_params;
        fastcgi_param SCRIPT_FILENAME C:/laragon/www/Nexa-inv/backend/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT C:/laragon/www/Nexa-inv/backend/public;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_pass 127.0.0.1:9000;
    }

    location ^~ /sanctum/ {
        include C:/laragon/bin/nginx/nginx-1.22.0/conf/fastcgi_params;
        fastcgi_param SCRIPT_FILENAME C:/laragon/www/Nexa-inv/backend/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT C:/laragon/www/Nexa-inv/backend/public;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_pass 127.0.0.1:9000;
    }

    # Laravel storage symlink/assets remain served by Nginx.
    location ^~ /storage/ {
        alias C:/laragon/www/Nexa-inv/backend/storage/app/public/;
        try_files $uri =404;
    }

    # Static Vite assets: long-lived cache because filenames are hashed.
    location ~* \.(?:css|js|mjs|jpg|jpeg|png|gif|ico|svg|webp|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    # React Router fallback; API requests are handled above.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Never expose PHP source files from the frontend document root.
    location ~ \.php$ {
        return 404;
    }
}
