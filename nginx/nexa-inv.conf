# Nexa-Inv production reverse proxy
# Copy to /etc/nginx/sites-available/nexa-inv and enable it.
# Adjust the absolute paths and PHP-FPM socket for the target server.

server {
    listen 80;
    listen [::]:80;
    # Default server: replace with the real domain when DNS is configured.
    server_name _;

    client_max_body_size 25m;

    # React/Vite production build.
    root /var/www/nexa-inv/frontend/dist;
    index index.html;

    # Keep API requests on Laravel and do not let the SPA fallback hide API errors.
    location ^~ /api/ {
        root /var/www/nexa-inv/backend/public;
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Laravel Sanctum or any future backend public endpoints.
    location ^~ /sanctum/ {
        root /var/www/nexa-inv/backend/public;
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Laravel public assets and storage links.
    location ^~ /storage/ {
        root /var/www/nexa-inv/backend/public;
        try_files $uri =404;
    }

    # PHP entry point for Laravel API requests.
    location ~ ^/index\.php(?:/|$) {
        root /var/www/nexa-inv/backend/public;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $document_root;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }

    # Do not expose arbitrary PHP files from either application.
    location ~ \.php$ {
        return 404;
    }

    # Vite SPA fallback for client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    location ~* \.(?:css|js|mjs|jpg|jpeg|png|gif|ico|svg|webp|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
